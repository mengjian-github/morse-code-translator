<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
  <title id="title">Classroom laser link Morse code experiment</title>
  <desc id="desc">A stylized classroom bench showing a laser pointer transmitting Morse code pulses to a light sensor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.6" stop-color="#17395c"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffdf64" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff4d6d" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1400" height="840" fill="url(#bg)"/>
  <g opacity="0.18" fill="#ffffff">
    <circle cx="210" cy="170" r="5"/><circle cx="350" cy="120" r="4"/><circle cx="1120" cy="190" r="6"/><circle cx="1240" cy="310" r="4"/>
  </g>
  <rect x="130" y="540" width="1140" height="85" rx="28" fill="#d8e2dc" opacity="0.95"/>
  <rect x="215" y="465" width="310" height="95" rx="20" fill="#f7f3e9"/>
  <rect x="250" y="505" width="210" height="32" rx="16" fill="#243b53"/>
  <circle cx="485" cy="520" r="28" fill="#ffdf64" filter="url(#glow)"/>
  <path d="M500 515 L1115 350 L1128 395 L505 540 Z" fill="url(#beam)" opacity="0.72" filter="url(#glow)"/>
  <rect x="1020" y="330" width="185" height="225" rx="24" fill="#f8f5eb"/>
  <circle cx="1112" cy="390" r="46" fill="#0b1b33"/>
  <circle cx="1112" cy="390" r="22" fill="#4cc9f0" filter="url(#glow)"/>
  <rect x="1065" y="470" width="94" height="44" rx="12" fill="#132540"/>
  <g fill="#ffffff" opacity="0.95">
    <rect x="1080" y="484" width="12" height="12" rx="6"/>
    <rect x="1102" y="484" width="38" height="12" rx="6"/>
    <rect x="1148" y="484" width="12" height="12" rx="6"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#fff7d6">
    <text x="180" y="230" font-size="56">LIGHT PULSE LINK</text>
    <text x="180" y="300" font-size="34" opacity="0.82">send · pause · detect · decode</text>
  </g>
  <g stroke="#ffdf64" stroke-width="12" stroke-linecap="round" opacity="0.85">
    <line x1="770" y1="650" x2="800" y2="650"/>
    <line x1="835" y1="650" x2="910" y2="650"/>
    <line x1="945" y1="650" x2="975" y2="650"/>
    <line x1="1010" y1="650" x2="1085" y2="650"/>
  </g>
</svg>
