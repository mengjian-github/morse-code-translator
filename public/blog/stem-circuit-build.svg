<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
  <title id="title">Students collaborating on a Morse code circuit build</title>
  <desc id="desc">A classroom workbench with a breadboard, LED signal circuit, notebooks, and Morse code timing cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b33"/>
      <stop offset="0.55" stop-color="#123b55"/>
      <stop offset="1" stop-color="#f7b733"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#06101f" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1400" height="840" fill="url(#bg)"/>
  <circle cx="1180" cy="150" r="145" fill="#ffe08a" opacity="0.22"/>
  <circle cx="190" cy="690" r="220" fill="#31d0aa" opacity="0.14"/>
  <g filter="url(#shadow)">
    <rect x="165" y="170" width="1070" height="520" rx="42" fill="#f8f5eb"/>
    <rect x="245" y="265" width="470" height="280" rx="28" fill="#132540"/>
    <rect x="285" y="305" width="390" height="200" rx="18" fill="#eef3f8"/>
    <g stroke="#2a415d" stroke-width="8" stroke-linecap="round">
      <line x1="325" y1="355" x2="635" y2="355"/>
      <line x1="325" y1="405" x2="635" y2="405"/>
      <line x1="325" y1="455" x2="635" y2="455"/>
    </g>
    <g fill="#ff6b35">
      <circle cx="380" cy="355" r="13"/>
      <circle cx="485" cy="405" r="13"/>
      <circle cx="600" cy="455" r="13"/>
    </g>
    <path d="M380 355 C420 310 455 455 485 405 S565 405 600 455" fill="none" stroke="#00a6fb" stroke-width="10" stroke-linecap="round"/>
    <rect x="790" y="250" width="310" height="360" rx="28" fill="#fff7d6"/>
    <g fill="#14213d" font-family="Arial, Helvetica, sans-serif" font-weight="700">
      <text x="835" y="330" font-size="44">SOS</text>
      <text x="835" y="405" font-size="36">... --- ...</text>
      <text x="835" y="485" font-size="28">DIT · DAH · PAUSE</text>
    </g>
    <g fill="#0b1b33" opacity="0.22">
